<div class="sidebar-container" [class.collapsed]="isCollapsed" [class.open]="isOpen">
  <!-- Sidebar Content -->
  <div class="sidebar-content">
    <!-- Sidebar Toggle Button -->
    <div class="sidebar-toggle">
      <button
        mat-icon-button
        (click)="toggleCollapsed()"
        [matTooltip]="isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'"
        matTooltipPosition="right"
        class="toggle-button"
      >
        <mat-icon
          >{{ isCollapsed ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left'
          }}</mat-icon
        >
      </button>
    </div>

    <!-- Logo Section (when expanded) -->
    <div class="sidebar-header" *ngIf="!isCollapsed">
      <div class="sidebar-logo">
        <img src="/images/deamontaskbooticon.png" alt="daemontaskboot" class="sidebar-logo-icon" />
        <span class="sidebar-logo-text">
          {{ languageService.translate('APP_NAME') || 'daemontaskboot' }}
        </span>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav" role="navigation">
      <!-- Main Menu Items -->
      <div class="main-menu">
        <a
          *ngFor="let item of menuItems"
          [routerLink]="getRoute(item.route)"
          routerLinkActive="active-route"
          [class.disabled]="item.disabled"
          (click)="onMenuItemClick(item)"
          class="nav-item"
          [matTooltip]="shouldShowTooltip() ? getMenuLabel(item) : ''"
          matTooltipPosition="right"
        >
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>

          <span *ngIf="!isCollapsed" class="menu-label"> {{ getMenuLabel(item) }} </span>

          <!-- Badge for notifications -->
          <span *ngIf="item.badge && item.badge > 0 && !isCollapsed" class="menu-badge">
            {{ item.badge > 99 ? '99+' : item.badge }}
          </span>

          <!-- Collapsed badge -->
          <div *ngIf="item.badge && item.badge > 0 && isCollapsed" class="collapsed-badge">
            {{ item.badge > 9 ? '9+' : item.badge }}
          </div>
        </a>
      </div>

      <!-- Divider -->
      <mat-divider class="menu-divider"></mat-divider>

      <!-- Additional Menu Items -->
      <div class="additional-menu">
        <a
          *ngFor="let item of additionalMenuItems"
          [routerLink]="getRoute(item.route)"
          routerLinkActive="active-route"
          [class.disabled]="item.disabled"
          (click)="onMenuItemClick(item)"
          class="nav-item"
          [matTooltip]="shouldShowTooltip() ? getMenuLabel(item) : ''"
          matTooltipPosition="right"
        >
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>

          <span *ngIf="!isCollapsed" class="menu-label"> {{ getMenuLabel(item) }} </span>
        </a>
      </div>
    </nav>

    <!-- Sidebar Footer (when expanded) -->
    <div class="sidebar-footer" *ngIf="!isCollapsed">
      <mat-divider></mat-divider>
      <div class="footer-content">
        <div class="version-info">
          <mat-icon class="version-icon">info</mat-icon>
          <span class="version-text">
            {{ languageService.translate('VERSION') || 'Version' }} 0.1.0
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
